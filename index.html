<!DOCTYPE html>
<html lang="pt-BR">


<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CODEX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>


<body class="app-bg">
  <div class="login-wrapper">
    <div class="card">

      <div class="tabs">
        <button class="tab-btn active" id="btn-entrar" onclick="mostrarEntrar()">Entrar</button>
        <button class="tab-btn" id="btn-cadastrar" onclick="mostrarCadastrar()">Cadastrar</button>
      </div>



      <div id="form-entrar" class="form-panel active">

        <div class="input-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" placeholder="seu@email.com" />
          </div>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="••••••••" />
          </div>
        </div>

        <button class="btn-primary">Entrar</button>

        <div class="divider">ou continue com</div>

        <button class="btn-google">
          <i class="fa-brands fa-google"></i> Google
        </button>

      </div>





      <div id="form-cadastrar" class="form-panel">

        <div class="input-group">
          <label>Usuário</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" placeholder="Seu usuário" />
          </div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" placeholder="seu@email.com" />
          </div>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="••••••••" />
          </div>
        </div>

        <button class="btn-primary">Criar Conta</button>

        <div class="divider">ou continue com</div>

        <button class="btn-google">
          <i class="fa-brands fa-google"></i> Google
        </button>

      </div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
