<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODEX - Badges</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/badges.css" />
  </head>
  <body class="badges-page">
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-book" viewBox="0 0 24 24" fill="none">
        <path
          d="M4 6.5C4 5.119 5.119 4 6.5 4H20v15.5a.5.5 0 0 1-.5.5H7a3 3 0 0 0-3 3V6.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M7 20h10"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M8 4h.5C9.881 4 11 5.119 11 6.5V20"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none">
        <path
          d="M8 4h8v3a4 4 0 0 1-8 0V4Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M16 5h2a2 2 0 0 1 0 4h-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M8 5H6a2 2 0 1 0 0 4h2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M12 11v4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M9 20h6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M10 15h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24" fill="none">
        <path
          d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1v-8.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-videos" viewBox="0 0 24 24" fill="none">
        <rect
          x="3"
          y="5"
          width="12"
          height="14"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="m15 10 6-3v10l-6-3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-school" viewBox="0 0 24 24" fill="none">
        <path
          d="M3 10 12 5l9 5-9 5-9-5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M7 12.5V17a11 11 0 0 0 10 0v-4.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-target" viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="12"
          cy="12"
          r="4"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" />
      </symbol>
      <symbol id="icon-ranking" viewBox="0 0 24 24" fill="none">
        <path
          d="M5 19h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M7 16V9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M12 16V5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M17 16v-3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-badge" viewBox="0 0 24 24" fill="none">
        <path
          d="m12 3 2.6 5.2 5.7.8-4.1 4 1 5.7L12 16l-5.2 2.7 1-5.7-4.1-4 5.7-.8L12 3Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="8"
          r="3.5"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M5 19a7 7 0 0 1 14 0"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol
        id="icon-book-open"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </symbol>
      <symbol
        id="icon-fire"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
        ></path>
      </symbol>
      <symbol
        id="icon-star"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
        ></polygon>
      </symbol>
      <symbol
        id="icon-medal"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="8" r="7"></circle>
        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
      </symbol>
      <symbol
        id="icon-zap"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </symbol>
      <symbol
        id="icon-lock"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </symbol>
      <symbol
        id="icon-check-circle"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </symbol>
    </svg>

    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-brand">
          <span class="icon icon--brand">
            <svg><use href="#icon-book"></use></svg>
          </span>
          <span class="app-brand__text">Codex</span>
        </div>
        <div class="app-header__status">
          <span class="status-pill">
            <span class="icon icon--xs">
              <svg><use href="#icon-trophy"></use></svg>
            </span>
            <span>0</span>
          </span>
          <span class="status-pill status-pill--level">Nível 1</span>
        </div>
      </div>
    </header>

    <main class="badges-container">
      <section class="badges-hero badges-hero--fancy">
        <div class="badges-hero__content">
          <div class="badges-hero__header">
            <div class="badges-hero__icon">
              <svg><use href="#icon-trophy"></use></svg>
            </div>
            <div class="badges-hero__text">
              <h1 class="badges-hero__title">Suas Conquistas</h1>
              <p class="badges-hero__subtitle" id="progress-text"></p>
            </div>
          </div>
          <div class="badges-hero__progress">
            <div class="progress-track">
              <div
                class="progress-fill"
                id="progress-fill"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <section class="badges-filters" id="badgesFilters">
        <button class="badge-filter active" data-filter="all">Todas</button>
        <button class="badge-filter" data-filter="unlocked">
          Desbloqueadas
        </button>
        <button class="badge-filter" data-filter="locked">Bloqueadas</button>
      </section>

      <section class="badges-list" id="badgesList"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="./home.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-home"></use></svg
        ></span>
        <span class="bottom-nav__label">Início</span>
      </a>
      <a href="./videos.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-videos"></use></svg
        ></span>
        <span class="bottom-nav__label">Vídeos</span>
      </a>
      <a href="./escola.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-school"></use></svg
        ></span>
        <span class="bottom-nav__label">Escola</span>
      </a>
      <a href="./desafios.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-target"></use></svg
        ></span>
        <span class="bottom-nav__label">Desafios</span>
      </a>
      <a href="./ranking.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-ranking"></use></svg
        ></span>
        <span class="bottom-nav__label">Ranking</span>
      </a>
      <a href="./badges.html" class="bottom-nav__item active">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-badge"></use></svg
        ></span>
        <span class="bottom-nav__label">Badges</span>
      </a>
      <a href="./perfil.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-user"></use></svg
        ></span>
        <span class="bottom-nav__label">Perfil</span>
      </a>
    </nav>

    <script src="../js/badges.js"></script>
  </body>
</html>
