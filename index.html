<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex - Login</title>
    <link rel="stylesheet" href="./css/global.css">
</head>
<body>

    <div class="cabecalho">
        <h1 style="background: white; color: #8A2BE2; display: inline-block; padding: 10px 15px; border-radius: 16px; margin-bottom: 10px;">📖</h1>
        <h1>Codex</h1>
        <p>Incentive a leitura de forma divertida</p>
    </div>

    <div class="cartao-branco">
        
        <form>
            <div class="grupo-input">
                <label>Email</label>
                <input type="email" placeholder="✉️ seu@email.com">
            </div>

            <div class="grupo-input">
                <label>Senha</label>
                <input type="password" placeholder="🔒 ••••••••">
            </div>

            <button type="button" class="btn-primario">Entrar</button>
        </form>

        <div class="divisor">ou continue com</div>

        <button type="button" class="btn-primario" style="background: white; color: #333; border: 1px solid #ddd;">
            G Google
        </button>

        <p style="text-align: center; font-size: 12px; margin-top: 20px;">
            Não tem conta? <strong style="color: #A020F0;">Cadastre-se</strong>
        </p>
    </div>

</body>
</html>
