<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CODEX - Perfil</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/perfil.css" />
  </head>
  <body class="profile-page">
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-book" viewBox="0 0 24 24" fill="none">

          d="M4 6.5C4 5.119 5.119 4 6.5 4H20v15.5a.5.5 0 0 1-.5.5H7a3 3 0 0 0-3 3V6.5Z"

          d="M7 20h10"

          stroke-linecap="round"
        />
        <path
          d="M8 4h.5C9.881 4 11 5.119 11 6.5V20"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none">
        <path
          d="M8 4h8v3a4 4 0 0 1-8 0V4Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M16 5h2a2 2 0 0 1 0 4h-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M8 5H6a2 2 0 1 0 0 4h2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M12 11v4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M9 20h6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M10 15h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24" fill="none">
        <path
          d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1v-8.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-videos" viewBox="0 0 24 24" fill="none">
        <rect
          x="3"
          y="5"
          width="12"
          height="14"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="m15 10 6-3v10l-6-3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-school" viewBox="0 0 24 24" fill="none">
        <path
          d="M3 10 12 5l9 5-9 5-9-5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M7 12.5V17a11 11 0 0 0 10 0v-4.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-target" viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle
          cx="12"
          cy="12"
          r="4"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" />
      </symbol>
      <symbol id="icon-ranking" viewBox="0 0 24 24" fill="none">
        <path
          d="M5 19h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M7 16V9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M12 16V5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <path
          d="M17 16v-3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-badge" viewBox="0 0 24 24" fill="none">
        <path
          d="m12 3 2.6 5.2 5.7.8-4.1 4 1 5.7L12 16l-5.2 2.7 1-5.7-4.1-4 5.7-.8L12 3Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="8"
          r="3.5"
          stroke="currentColor"
          stroke-width="1.8"
        />
        <path
          d="M5 19a7 7 0 0 1 14 0"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol
        id="icon-settings"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        ></path>
      </symbol>
      <symbol
        id="icon-edit"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
        ></path>
        <path
          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
        ></path>
      </symbol>
      <symbol
        id="icon-flame"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
        ></path>
      </symbol>
      <symbol
        id="icon-clock"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </symbol>
      <symbol
        id="icon-chevron-right"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="9 18 15 12 9 6"></polyline>
      </symbol>
      <symbol
        id="icon-log-out"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </symbol>
      <symbol
        id="icon-bell"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </symbol>
      <symbol
        id="icon-help"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </symbol>
    </svg>

    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-brand">
          <span class="icon icon--brand">
            <svg><use href="#icon-book"></use></svg>
          </span>
          <span class="app-brand__text">Codex</span>
        </div>
        <div class="app-header__status">
          <button class="icon-btn">
            <svg><use href="#icon-settings"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="profile-container">
      <section class="profile-hero fade-up" style="animation-delay: 0s">
        <div class="profile-hero__avatar-wrapper">
          <div class="profile-hero__avatar" id="user-avatar"></div>
          <button class="profile-hero__edit-btn">
            <svg><use href="#icon-edit"></use></svg>
          </button>
        </div>
        <h1 class="profile-hero__name" id="user-name"></h1>
        <p class="profile-hero__handle" id="user-handle"></p>
        <div class="profile-hero__level-badge">
          <svg><use href="#icon-trophy"></use></svg>
          <span id="user-level"></span>
        </div>
      </section>

      <section
        class="profile-stats fade-up"
        style="animation-delay: 0.1s"
        id="stats-container"
      ></section>

      <section class="profile-current fade-up" style="animation-delay: 0.2s">
        <div class="section-header">
          <h2 class="section-title">Lendo Agora</h2>
          <a href="#" class="section-link">Ver biblioteca</a>
        </div>
        <div class="current-book-card" id="current-book-container"></div>
      </section>

      <section class="profile-menu fade-up" style="animation-delay: 0.3s">
        <div class="menu-list">
          <a href="#" class="menu-item">
            <div class="menu-item__left">
              <div class="menu-item__icon bg-blue">
                <svg><use href="#icon-user"></use></svg>
              </div>
              <span>Dados Pessoais</span>
            </div>
            <svg class="menu-item__arrow">
              <use href="#icon-chevron-right"></use>
            </svg>
          </a>
          <a href="#" class="menu-item">
            <div class="menu-item__left">
              <div class="menu-item__icon bg-yellow">
                <svg><use href="#icon-bell"></use></svg>
              </div>
              <span>Notificações</span>
            </div>
            <svg class="menu-item__arrow">
              <use href="#icon-chevron-right"></use>
            </svg>
          </a>
          <a href="#" class="menu-item">
            <div class="menu-item__left">
              <div class="menu-item__icon bg-green">
                <svg><use href="#icon-help"></use></svg>
              </div>
              <span>Central de Ajuda</span>
            </div>
            <svg class="menu-item__arrow">
              <use href="#icon-chevron-right"></use>
            </svg>
          </a>
          <a href="../index.html" class="menu-item menu-item--danger">
            <div class="menu-item__left">
              <div class="menu-item__icon bg-red">
                <svg><use href="#icon-log-out"></use></svg>
              </div>
              <span>Sair da conta</span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="./home.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-home"></use></svg
        ></span>
        <span class="bottom-nav__label">Início</span>
      </a>
      <a href="./videos.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-videos"></use></svg
        ></span>
        <span class="bottom-nav__label">Vídeos</span>
      </a>
      <a href="./escola.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-school"></use></svg
        ></span>
        <span class="bottom-nav__label">Escola</span>
      </a>
      <a href="./desafios.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-target"></use></svg
        ></span>
        <span class="bottom-nav__label">Desafios</span>
      </a>
      <a href="./ranking.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-ranking"></use></svg
        ></span>
        <span class="bottom-nav__label">Ranking</span>
      </a>
      <a href="./badges.html" class="bottom-nav__item">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-badge"></use></svg
        ></span>
        <span class="bottom-nav__label">Badges</span>
      </a>
      <a href="./perfil.html" class="bottom-nav__item active">
        <span class="bottom-nav__icon"
          ><svg><use href="#icon-user"></use></svg
        ></span>
        <span class="bottom-nav__label">Perfil</span>
      </a>
    </nav>

    <script src="../js/perfil.js"></script>
  </body>
</html>
